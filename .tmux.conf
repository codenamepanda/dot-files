# Enable mouse support
set -g mouse on

# Set prefix to Ctrl-a instead of Ctrl-b (optional)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Split panes
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Switch panes using vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Ctrl + Arrow
bind -n C-Left  resize-pane -L 5
bind -n C-Right resize-pane -R 5
bind -n C-Up    resize-pane -U 5
bind -n C-Down  resize-pane -D 5

# Set easier pane navigation (Alt + arrow)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Start windows at 1
set -g base-index 1
setw -g pane-base-index 1

# Enable vi-mode in copy
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'  # session persistence
set -g @plugin 'tmux-plugins/tmux-continuum'  # auto-save

# initialize TPM
run '~/.tmux/plugins/tpm/tpm'

# Add these in your TPM plugin block
set -g @plugin 'tmux-plugins/tmux-battery'     # battery in status
set -g @plugin 'tmux-plugins/tmux-cpu'         # CPU load
set -g @plugin 'tmux-plugins/tmux-open'        # open highlighted URLs
set -g @plugin 'tmux-plugins/tmux-yank'        # yank to system clipboard

# Resurrect/Continuum options
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

# Clean and informative status bar
set -g status-bg '#282828'
set -g status-fg white
set -g status-interval 5

# Left side: session name
set -g status-left "#[fg=white]#S λ "

# Right side: date, time, battery
set -g status-right "#[fg=white]%Y-%m-%d #[fg=cyan]%H:%M #[fg=magenta]🔋#{battery_status_bg}"

# Enable battery plugin data
set -g @battery_low_fg 'red'
set -g @battery_status_bg 'green'

# Interating Git
set -g @plugin 'tmux-plugins/tmux-sidebar'
# Show current git branch (needs sidebar or custom script)
set -g status-right "#(git rev-parse --abbrev-ref HEAD 2>/dev/null) | %Y-%m-%d %H:%M"
